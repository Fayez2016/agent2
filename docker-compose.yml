services:
  hermes:
    image: local-hermes
    container_name: hermes-agent
    command: gateway run
    volumes:
      - ./.hermes:/opt/data:Z
      - /run/user/1000/podman/podman.sock:/run/user/1000/podman/podman.sock:Z
      - .:/home/fayez/agent2:Z
    environment:
      - TZ=UTC
      - AAP_HOST=aap-server:5000
      - AAP_TOKEN=mock-token
      - CONTAINER_HOST=unix:///run/user/1000/podman/podman.sock
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=hermes-api-secret
      - GATEWAY_ALLOW_ALL_USERS=true
      - DEBUG=1
      - HERMES_DASHBOARD_TUI=1
    ports:
      - "8642:8642"
      - "9119:9119"
    networks:
      - default
    depends_on:
      - aap-server
      - ansible-mcp
    restart: unless-stopped
    entrypoint: /bin/bash
    command: >
      -c "/opt/hermes/docker/entrypoint.sh dashboard --host 0.0.0.0 --insecure --no-open & /opt/hermes/docker/entrypoint.sh gateway run"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    shm_size: '1gb'

  aap-server:
    build:
      context: .
      dockerfile: mock_aap.Dockerfile
    image: agent2_aap-server
    container_name: aap-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - default

  db:
    build:
      context: ./db
    image: agent2_hitl-db
    container_name: hitl-db
    environment:
      - POSTGRES_USER=hermes
      - POSTGRES_PASSWORD=hermes123
      - POSTGRES_DB=hitl
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:Z
    networks:
      - default
    restart: unless-stopped

  hitl-web:
    build:
      context: ./hitl_web
    image: agent2_hitl-web
    container_name: hitl-web
    environment:
      - DATABASE_URL=postgresql://hermes:hermes123@db:5432/hitl
      - SECRET_KEY=hitl-secret-key-123
    ports:
      - "5001:5000"
    depends_on:
      - db
    networks:
      - default
    restart: unless-stopped

  ansible-mcp:
    build:
      context: .
      dockerfile: ansible_mcp.Dockerfile
    image: agent2_ansible-mcp
    container_name: ansible-mcp
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AAP_HOST=aap-server:5000
      - AAP_TOKEN=mock-token
      - DATABASE_URL=postgresql://hermes:hermes123@db:5432/hitl
    depends_on:
      - db
    networks:
      - default

networks:
  default:
    name: agent2_default
