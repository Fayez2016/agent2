services:
  hermes:
    image: local-hermes
    container_name: hermes-agent
    command: gateway run
    volumes:
      - ./.hermes:/opt/data:Z
      - /run/user/1000/podman/podman.sock:/run/user/1000/podman/podman.sock:Z
      - .:/home/fayez/agent2:Z
    environment:
      - TZ=UTC
      - AAP_HOST=${AAP_HOST}
      - AAP_TOKEN=${AAP_TOKEN}
      - CONTAINER_HOST=unix:///run/user/1000/podman/podman.sock
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY}
      - GATEWAY_ALLOW_ALL_USERS=true
      - DEBUG=1
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_TUI=1
    ports:
      - "8642:8642"
      - "9119:9119"
    networks:
      - default
    depends_on:
      - aap-server
      - ansible-mcp
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    shm_size: '1gb'

  aap-server:
    build:
      context: .
      dockerfile: mock_aap.Dockerfile
    image: agent2_aap-server
    container_name: aap-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - default

  db:
    build:
      context: ./db
    image: agent2_hitl-db
    container_name: hitl-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:Z
    networks:
      - default
    restart: unless-stopped

  hitl-web:
    build:
      context: ./hitl_web
    image: agent2_hitl-web
    container_name: hitl-web
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
    ports:
      - "5001:5000"
    depends_on:
      - db
    networks:
      - default
    restart: unless-stopped

  ansible-mcp:
    build:
      context: .
      dockerfile: ansible_mcp.Dockerfile
    image: agent2_ansible-mcp
    container_name: ansible-mcp
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AAP_HOST=${AAP_HOST}
      - AAP_TOKEN=${AAP_TOKEN}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db
    networks:
      - default

networks:
  default:
    name: agent2_default
