services:
  hermes:
    image: local-hermes
    container_name: hermes-agent
    command: gateway run
    volumes:
      - ./.hermes:/opt/data:Z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    shm_size: '1gb'
    environment:
      - TZ=UTC
      - AAP_HOST=aap-server:5000
      - AAP_TOKEN=mock-token
    depends_on:
      - aap-server

  aap-server:
    build:
      context: .
      dockerfile: mock_aap.Dockerfile
    container_name: aap-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - default

networks:
  default:
    name: agent2_default
