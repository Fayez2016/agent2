# ==============================================================================
#  🔒 Enterprise TLS 1.3 Reverse Proxy Configuration for Deep Agent Platform
# ==============================================================================
worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Upstream Definitions (Internal Container Network)
    upstream deepagent_api {
        server deepagent-service:8642;
        keepalive 32;
    }

    upstream deepagent_webui {
        server deepagent-webui:3000;
        keepalive 16;
    }

    upstream ansible_mcp {
        server deepagent-ansible-mcp:8000;
        keepalive 16;
    }

    upstream sop_mcp {
        server deepagent-sop-mcp:8001;
        keepalive 16;
    }

    # 1. HTTP Redirect to HTTPS (Port 8080 -> Port 8443)
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    # 2. Hardened HTTPS Server (Port 8443)
    server {
        listen 8443 ssl http2;
        listen [::]:8443 ssl http2;
        server_name _;

        # TLS Certificates & Keys
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # TLS Protocols & Cipher Suites (NIST / CIS Hardened)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Web UI (Root Location)
        location / {
            proxy_pass http://deepagent_webui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Deep Agent Core API & Orchestrator (/v1/)
        location /v1/ {
            proxy_pass http://deepagent_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }

        # FastMCP Tool Endpoints (Ansible & SOP)
        location /mcp/ansible/ {
            rewrite ^/mcp/ansible/(.*) /$1 break;
            proxy_pass http://ansible_mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /mcp/sop/ {
            rewrite ^/mcp/sop/(.*) /$1 break;
            proxy_pass http://sop_mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
