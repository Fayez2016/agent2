# ==============================================================================
#  🏢 Deep Agent Enterprise Production Stack (with Hardened TLS 1.3 Reverse Proxy)
# ==============================================================================
version: '3.8'

services:
  # 1. Hardened TLS 1.3 Reverse Proxy (Single Entry Point for Fleet / Operators)
  proxy:
    image: quay.io/souffm0a/deepagent-proxy:latest
    container_name: deepagent-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse_proxy/ssl:/etc/nginx/ssl:ro,Z
    depends_on:
      - service
      - webui
      - ansible-mcp
      - sop-mcp
    networks:
      - deepagent_prod_net

  # 2. PostgreSQL 16 DB Engine (HITL Gate & Session Store)
  db:
    image: quay.io/souffm0a/deepagent-hitl-db:latest
    container_name: deepagent-hitl-db
    restart: always
    environment:
      - POSTGRES_USER=hermes
      - POSTGRES_PASSWORD=secret456
      - POSTGRES_DB=hitl
    volumes:
      - db-data:/var/lib/postgresql/data:Z
    networks:
      - deepagent_prod_net

  # 3. Ansible FastMCP Server (Port 8000 + Physical Command Guard)
  ansible-mcp:
    image: quay.io/souffm0a/deepagent-ansible-mcp:latest
    container_name: deepagent-ansible-mcp
    restart: always
    environment:
      - AAP_HOST=aap-server:5000
      - AAP_TOKEN=mock-token
      - DATABASE_URL=postgresql://hermes:secret456@db:5432/hitl
    depends_on:
      - db
      - aap-server
    networks:
      - deepagent_prod_net

  # 4. Declarative SOP FastMCP Server (Port 8001)
  sop-mcp:
    image: quay.io/souffm0a/deepagent-sop-mcp:latest
    container_name: deepagent-sop-mcp
    restart: always
    environment:
      - DATABASE_URL=postgresql://hermes:secret456@db:5432/hitl
    depends_on:
      - db
    networks:
      - deepagent_prod_net

  # 5. Core LangGraph SRE Lead Agent Engine (Port 8642)
  service:
    image: quay.io/souffm0a/deepagent-core:latest
    container_name: deepagent-service
    restart: always
    environment:
      - DATABASE_URL=postgresql://hermes:secret456@db:5432/hitl
      - ANSIBLE_MCP_URL=http://ansible-mcp:8000/mcp
      - SOP_MCP_URL=http://sop-mcp:8001/mcp
      - CUSTOM_OPENAI_BASE_URL=http://ollama:11434/v1
      - CUSTOM_OPENAI_MODEL_NAME=deepagent
    depends_on:
      - db
      - ansible-mcp
      - sop-mcp
    networks:
      - deepagent_prod_net

  # 6. SRE Web Console (Port 3000)
  webui:
    image: quay.io/souffm0a/deepagent-hitl-web:latest
    container_name: deepagent-webui
    restart: always
    networks:
      - deepagent_prod_net

  # 7. Ansible Automation Platform (AAP) Simulation Engine
  aap-server:
    image: quay.io/souffm0a/deepagent-mock-aap:latest
    container_name: deepagent-aap-server
    restart: always
    networks:
      - deepagent_prod_net

networks:
  deepagent_prod_net:
    driver: bridge

volumes:
  db-data:
