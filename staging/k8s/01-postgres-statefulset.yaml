apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hitl-db
  namespace: agent2-airgap
spec:
  serviceName: hitl-db
  replicas: 1
  selector:
    matchLabels:
      app: hitl-db
  template:
    metadata:
      labels:
        app: hitl-db
    spec:
      containers:
      - name: postgres
        image: quay.io/fayez2016/hitl-db:staging
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: hermes
        - name: POSTGRES_PASSWORD
          value: secret456
        - name: POSTGRES_DB
          value: hitl
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: agent2-airgap
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: hitl-db
