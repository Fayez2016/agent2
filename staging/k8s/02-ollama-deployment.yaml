apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: agent2-airgap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: quay.io/fayez2016/local-ollama:gemma4-12b
        ports:
        - containerPort: 11434
        resources:
          limits:
            cpu: "4.0"
            memory: 8Gi
          requests:
            cpu: "2.0"
            memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: agent2-airgap
spec:
  ports:
  - port: 11434
    targetPort: 11434
  selector:
    app: ollama
